<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임수환 공던지기 K.O. 게임</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: #F3EDE3; color: #2B2118;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; min-height: 100%;
  }
  .app { width: 100%; max-width: 660px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: #8A7A66; margin-top: 4px; }
  #stage {
    position: relative; height: 520px; border-radius: 16px; overflow: hidden;
    background: #F7F1E7; border: 1px solid #E7DFD3; cursor: crosshair; touch-action: none;
  }
  #stage canvas { display: block; }

  .hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; pointer-events: none; }
  .tile { background: rgba(255,255,255,.92); border: 1px solid #E7DFD3; border-radius: 10px; padding: 7px 12px; min-width: 78px; }
  .tile .lab { font-size: 10px; font-weight: 700; color: #8A7A66; }
  .tile .val { font-size: 18px; font-weight: 800; color: #2B2118; line-height: 1.2; }

  #hpWrap { position: absolute; transform: translate(-50%, -100%); width: 116px; pointer-events: none; transition: opacity .15s; }
  #hpName { font-size: 10px; font-weight: 800; color: #4A3B30; text-align: center; margin-bottom: 3px; text-shadow: 0 1px 0 #FFF9F2; }
  #hpTrack { height: 8px; background: #E7DFD3; border-radius: 5px; overflow: hidden; border: 1px solid #D8CBB8; }
  #hpFill { height: 100%; width: 100%; background: #3B9E63; border-radius: 5px; transition: width .1s linear, background .2s; }

  #bubble { position: absolute; transform: translate(-50%, -100%); background: #fff; border: 1px solid #E7DFD3; color: #2B2118;
            font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; }
  #bubble::after { content: ''; position: absolute; bottom: -6px; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top-color: #fff; }

  .ov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(247,241,231,.9); }
  .panel { background: #fff; border: 1px solid #E7DFD3; border-radius: 16px; padding: 26px 24px; text-align: center; max-width: 330px; }
  .panel .t { font-size: 18px; font-weight: 800; }
  .panel p { font-size: 12px; color: #8A7A66; margin: 10px 0 16px; line-height: 1.7; }
  .btn { background: #E23D5B; color: #fff; border: none; font-size: 14px; font-weight: 700; padding: 11px 24px; border-radius: 10px; cursor: pointer; }
  .btn:hover { background: #C22B48; }
  .rows { display: flex; justify-content: center; gap: 20px; margin: 8px 0 18px; }
  .rows div { font-size: 11px; font-weight: 700; color: #8A7A66; }
  .rows b { display: block; font-size: 20px; color: #2B2118; }
  .foot { font-size: 11px; color: #B3A48E; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>임수환을 패세요!!</h1>
  </div>

  <div id="stage">
    <div class="hud">
      <div class="tile"><div class="lab">점수</div><div class="val" id="hudScore">0</div></div>
      <div class="tile"><div class="lab">K.O.</div><div class="val" id="hudKO">0</div></div>
      <div class="tile"><div class="lab">남은 시간</div><div class="val" id="hudTime">30.0</div></div>
      <div class="tile" style="margin-left:auto"><div class="lab">최대 콤보</div><div class="val" id="hudCombo">x0</div></div>
    </div>

    <div id="hpWrap">
      <div id="hpName">수환 Lv.1</div>
      <div id="hpTrack"><div id="hpFill"></div></div>
    </div>
    <div id="bubble">도망!</div>

    <div class="ov" id="startOv">
      <div class="panel">
        <div class="t">공을 던져 혼내주세요</div>
        <p>마우스를 움직여 조준하고 <b>클릭</b>하면 공이 날아갑니다.<br>
        수환은 조준점 근처를 피해 도망가요.<br>
        30초 동안 최대한 많이 맞혀 K.O.를 노리세요.</p>
        <button class="btn" id="startBtn">게임 시작</button>
      </div>
    </div>

    <div class="ov" id="endOv" style="display:none">
      <div class="panel">
        <div class="t">시간 종료!</div>
        <div class="rows">
          <div>점수<b id="rScore">0</b></div>
          <div>K.O.<b id="rKO">0</b></div>
          <div>최대 콤보<b id="rCombo">x0</b></div>
        </div>
        <button class="btn" id="againBtn">다시 하기</button>
      </div>
    </div>
  </div>

  <p class="foot">※ 실제 임수환은 K.O. 이후 항상 멀쩡하게 부활합니다.</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

const stage = document.getElementById('stage');
const hudScore = document.getElementById('hudScore');
const hudKO = document.getElementById('hudKO');
const hudTime = document.getElementById('hudTime');
const hudCombo = document.getElementById('hudCombo');
const hpWrap = document.getElementById('hpWrap');
const hpFill = document.getElementById('hpFill');
const hpName = document.getElementById('hpName');
const bubbleEl = document.getElementById('bubble');
const startOv = document.getElementById('startOv');
const endOv = document.getElementById('endOv');

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xF7F1E7);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 3.25, 7.2);
camera.lookAt(0, 1.0, 0);

scene.add(new THREE.HemisphereLight(0xFFF6EA, 0xCFBBA6, 1.2));
const key = new THREE.DirectionalLight(0xFFF2E0, 1.7);
key.position.set(3.5, 7, 4.5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
const sc = key.shadow.camera;
sc.left = -8; sc.right = 8; sc.top = 8; sc.bottom = -8; sc.near = 0.5; sc.far = 26;
scene.add(key);
const fill = new THREE.DirectionalLight(0xE8EEFF, 0.45);
fill.position.set(-4, 3, 2);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9.4, 64),
  new THREE.MeshStandardMaterial({ color: 0xEFE3D3, roughness: 0.96 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(6.1, 6.22, 72),
  new THREE.MeshBasicMaterial({ color: 0xE2D3C0 })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.004;
scene.add(ring);

/* ---------- 수환 캐릭터 ---------- */
const MAT = {
  skin: new THREE.MeshStandardMaterial({ color: 0xF0BE95, roughness: 0.55 }),
  shirt: new THREE.MeshStandardMaterial({ color: 0xE23D5B, roughness: 0.5 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x3B2E28, roughness: 0.45 }),
  white: new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.3 })
};

const guy = new THREE.Group();
scene.add(guy);

function part(geo, mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (sx !== undefined) m.scale.set(sx, sy, sz);
  m.castShadow = true;
  guy.add(m);
  return m;
}

const bodyM = part(new THREE.SphereGeometry(0.46, 26, 20), MAT.shirt, 0, 0.95, 0, 1, 0.92, 0.84);
const legL = part(new THREE.CylinderGeometry(0.085, 0.075, 0.46, 12), MAT.dark, -0.17, 0.26, 0);
const legR = part(new THREE.CylinderGeometry(0.085, 0.075, 0.46, 12), MAT.dark, 0.17, 0.26, 0);
const armL = part(new THREE.SphereGeometry(0.14, 16, 12), MAT.skin, -0.5, 0.98, 0);
const armR = part(new THREE.SphereGeometry(0.14, 16, 12), MAT.skin, 0.5, 0.98, 0);
const headM = part(new THREE.SphereGeometry(0.4, 30, 24), MAT.skin, 0, 1.62, 0);
part(new THREE.SphereGeometry(0.415, 30, 18, 0, Math.PI * 2, 0, Math.PI * 0.53), MAT.dark, 0, 1.62, 0);
part(new THREE.SphereGeometry(0.11, 14, 10), MAT.dark, 0.1, 1.97, 0.03, 1, 0.7, 1);
part(new THREE.SphereGeometry(0.055, 12, 10), MAT.dark, -0.13, 1.645, 0.355);
part(new THREE.SphereGeometry(0.055, 12, 10), MAT.dark, 0.13, 1.645, 0.355);
const glassesGeo = new THREE.TorusGeometry(0.115, 0.016, 8, 26);
part(glassesGeo, MAT.dark, -0.135, 1.64, 0.335);
part(glassesGeo, MAT.dark, 0.135, 1.64, 0.335);
part(new THREE.BoxGeometry(0.07, 0.018, 0.02), MAT.dark, 0, 1.64, 0.345);
const mouthM = part(new THREE.TorusGeometry(0.075, 0.013, 8, 18, Math.PI * 0.9), MAT.dark, 0, 1.45, 0.345);
mouthM.rotation.z = Math.PI * 0.05;

/* ---------- 조준 리티클 ---------- */
const reticle = new THREE.Group();
const retOuter = new THREE.Mesh(
  new THREE.RingGeometry(0.24, 0.3, 32),
  new THREE.MeshBasicMaterial({ color: 0xE23D5B, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
);
reticle.add(retOuter);
const retDot = new THREE.Mesh(
  new THREE.CircleGeometry(0.045, 16),
  new THREE.MeshBasicMaterial({ color: 0xE23D5B, transparent: true, opacity: 0.9 })
);
reticle.add(retDot);
reticle.rotation.x = -Math.PI / 2;
reticle.position.y = 0.01;
scene.add(reticle);

/* ---------- 게임 상태 ---------- */
const BOUND = { x: 6.2, z: 3.4 };
const G = 20;
const state = {
  mode: 'ready', score: 0, kos: 0, combo: 0, maxCombo: 0, comboT: 0,
  time: 30, hp: 100, maxHp: 100, level: 1, speed: 2.1,
  koT: 0, invT: 0, flash: 0, walk: 0, bubbleT: 0, lastThrow: 0, hitStop: 0,
  roll: 0, rollDur: 0.55, rollAxis: new THREE.Vector3(1, 0, 0),
  dashT: 0, dashCD: 0, dashVel: new THREE.Vector3(), ghostTick: 0
};
const guyState = {
  pos: new THREE.Vector3(0, 0, 0),
  vel: new THREE.Vector3(0, 0, 0),
  dir: new THREE.Vector2(1, 0),
  changeT: 0
};

const balls = [];
const effects = [];
const pointer = { x: 0, y: 0, has: false };
const aim = new THREE.Vector3(0, 1, 0);
const raycaster = new THREE.Raycaster();
const aimPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.0);

const taunts = ['도망!', '왜 던져요?!', '심심했어요?', '커피 쏠게요!', '잘못했삼다', '야근은 안 해요!'];
const hitLines = ['아야!', '윽!', '거기 아니에요!', '진심이에요?'];

function say(text, dur) {
  bubbleEl.textContent = text;
  state.bubbleT = dur || 1.6;
}

/* ---------- 사운드 ---------- */
let actx = null;
function sfx(kind) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    if (kind === 'throw') {
      o.type = 'sine';
      o.frequency.setValueAtTime(430, t);
      o.frequency.exponentialRampToValueAtTime(120, t + 0.16);
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
    } else if (kind === 'hit') {
      o.type = 'square';
      o.frequency.setValueAtTime(340, t);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.09);
      g.gain.setValueAtTime(0.06, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.start(t); o.stop(t + 0.13);
    } else if (kind === 'dash') {
      o.type = 'triangle';
      o.frequency.setValueAtTime(900, t);
      o.frequency.exponentialRampToValueAtTime(320, t + 0.09);
      g.gain.setValueAtTime(0.035, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      o.start(t); o.stop(t + 0.12);
    } else {
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(190, t);
      o.frequency.exponentialRampToValueAtTime(48, t + 0.5);
      g.gain.setValueAtTime(0.07, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      o.start(t); o.stop(t + 0.6);
    }
  } catch (e) { /* 무음 환경 무시 */ }
}

/* ---------- 텍스트/별 스프라이트 ---------- */
function makeTextSprite(text, color, big) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.font = (big ? '800 92px' : '800 68px') + ' -apple-system, system-ui, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineWidth = big ? 10 : 8;
  g.strokeStyle = 'rgba(255,249,242,0.9)';
  g.strokeText(text, 256, 64);
  g.fillStyle = color;
  g.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
  sp.scale.set(big ? 2.4 : 1.25, big ? 0.6 : 0.31, 1);
  return sp;
}

function makeStarSprite() {
  if (makeStarSprite.tex) return new THREE.SpriteMaterial({ map: makeStarSprite.tex, transparent: true, depthTest: false, depthWrite: false });
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.translate(64, 64);
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 26 : 60;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
  g.fillStyle = '#F5A623';
  g.fill();
  const tex = new THREE.CanvasTexture(c);
  makeStarSprite.tex = tex;
  return new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false });
}

function spawnStars(pos, n) {
  for (let i = 0; i < n; i++) {
    const sp = new THREE.Sprite(makeStarSprite());
    sp.position.copy(pos);
    const s = 0.18 + Math.random() * 0.18;
    sp.scale.set(s, s, 1);
    scene.add(sp);
    effects.push({
      obj: sp,
      vel: new THREE.Vector3((Math.random() - 0.5) * 4, 2 + Math.random() * 3, (Math.random() - 0.5) * 4),
      life: 0, max: 0.6 + Math.random() * 0.25, type: 'star'
    });
  }
}

function spawnText(pos, text, color, big) {
  const sp = makeTextSprite(text, color || '#D92646', big);
  sp.position.copy(pos);
  scene.add(sp);
  effects.push({ obj: sp, vel: new THREE.Vector3(0, big ? 0.9 : 1.3, 0), life: 0, max: big ? 1.3 : 0.9, type: 'text' });
}

/* ---------- 공 ---------- */
const ballGeo = new THREE.SphereGeometry(0.15, 18, 14);
function throwBall() {
  if (state.mode !== 'playing' || state.koT > 0) return;
  const now = performance.now();
  if (now - state.lastThrow < 180) return;
  state.lastThrow = now;

  const mesh = new THREE.Mesh(ballGeo, MAT.white);
  mesh.castShadow = true;
  const start = new THREE.Vector3(0, 0.9, 5.2);
  mesh.position.copy(start);
  scene.add(mesh);

  const target = aim.clone();
  target.y = Math.max(0.45, Math.min(1.85, target.y));
  const vel = solveArc(start, target, 28, G);
  balls.push({ mesh, vel, life: 0, bounced: 0, dead: false });
  sfx('throw');
}

function solveArc(from, to, speed, g) {
  const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
  const d = Math.hypot(dx, dz);
  if (d < 0.001) return new THREE.Vector3(0, speed, 0);
  const s2 = speed * speed;
  const disc = s2 * s2 - g * (g * d * d + 2 * dy * s2);
  let tanT;
  if (disc < 0) {
    return new THREE.Vector3(dx, dy + d * 0.45, dz).normalize().multiplyScalar(speed * 0.95);
  }
  tanT = (s2 - Math.sqrt(disc)) / (g * d);
  const cosT = 1 / Math.sqrt(1 + tanT * tanT);
  const vh = speed * cosT, vy = speed * tanT * cosT;
  return new THREE.Vector3((dx / d) * vh, vy, (dz / d) * vh);
}

/* ---------- 피격 ---------- */
function hitSuhwan(point, dirVec) {
  if (state.invT > 0) {
    spawnText(new THREE.Vector3(guyState.pos.x, 2.15, guyState.pos.z), '무적!', '#8A7A66', false);
    return;
  }
  state.combo++;
  state.comboT = 1.5;
  if (state.combo > state.maxCombo) state.maxCombo = state.combo;

  const dmg = Math.round(8 + Math.random() * 6 + (state.combo - 1) * 2);
  state.hp -= dmg;
  state.score += dmg;
  state.flash = 0.16;

  spawnStars(point, 7);
  spawnText(new THREE.Vector3(guyState.pos.x, 2.1, guyState.pos.z), '-' + dmg + (state.combo > 1 ? ' x' + state.combo : ''), '#D92646', false);

  // 맞으면 옆으로 구르면서 자리 이동
  const kb = new THREE.Vector3(dirVec.x, 0, dirVec.z);
  if (kb.lengthSq() < 0.0001) kb.set(0, 0, -1);
  kb.normalize();
  const side = new THREE.Vector3(-kb.z, 0, kb.x);
  if (Math.random() < 0.5) side.negate();
  state.roll = state.rollDur;
  state.rollAxis.set(side.z, 0, -side.x).normalize();     // 굴러가는 축
  guyState.vel.multiplyScalar(0.2).addScaledVector(side, 3.8).addScaledVector(kb, 1.6);
  state.dashT = 0;

  sfx('hit');

  if (state.hp <= 0) {
    state.hp = 0;
    state.kos++;
    state.score += 200;
    state.koT = 1.15;
    state.combo = 0;
    state.roll = 0;
    state.dashT = 0;
    spawnText(new THREE.Vector3(guyState.pos.x, 2.5, guyState.pos.z), 'K.O.!', '#E23D5B', true);
    spawnStars(point, 16);
    say('부활할게요...', 1.1);
    sfx('ko');
  } else if (Math.random() < 0.4) {
    say(hitLines[Math.floor(Math.random() * hitLines.length)], 1.2);
  }
}

/* ---------- 쉐도우 무빙 ---------- */
function spawnGhost() {
  const clone = guy.clone(true);
  const mats = [];
  clone.traverse(function (o) {
    if (o.isMesh) {
      o.castShadow = false;
      o.material = o.material.clone();
      o.material.transparent = true;
      o.material.opacity = 0.34;
      o.material.depthWrite = false;
      mats.push(o.material);
    }
  });
  scene.add(clone);
  effects.push({ obj: clone, vel: new THREE.Vector3(), life: 0, max: 0.34, type: 'ghost', mats: mats });
}

function startDash(dxAim, dzAim) {
  const away = new THREE.Vector3(dxAim, 0, dzAim);
  if (away.lengthSq() < 0.0004) away.set(Math.random() - 0.5, 0, Math.random() - 0.5);
  away.normalize();
  const side = new THREE.Vector3(-away.z, 0, away.x);
  if (Math.random() < 0.5) side.negate();
  const dir = away.multiplyScalar(0.45).add(side).normalize();
  state.dashVel.copy(dir).multiplyScalar(12);
  state.dashT = 0.17;
  state.dashCD = 0.95 + Math.random() * 0.35;
  state.ghostTick = 0;
  spawnGhost();
  if (Math.random() < 0.6) say('슥!', 0.45);
  sfx('dash');
}

/* ---------- 리셋 ---------- */
function resetGame() {
  state.score = 0; state.kos = 0; state.combo = 0; state.maxCombo = 0; state.comboT = 0;
  state.time = 30; state.hp = 100; state.maxHp = 100; state.level = 1; state.speed = 2.1;
  state.koT = 0; state.invT = 0; state.flash = 0; state.bubbleT = 0;
  state.roll = 0; state.dashT = 0; state.dashCD = 0; state.ghostTick = 0;
  state.dashVel.set(0, 0, 0); state.rollAxis.set(1, 0, 0);
  guy.quaternion.identity();
  guyState.pos.set(0, 0, 0);
  guyState.vel.set(0, 0, 0);
  guy.rotation.set(0, 0, 0);
  guy.scale.set(1, 1, 1);
  balls.forEach(b => scene.remove(b.mesh));
  balls.length = 0;
  effects.forEach(e => scene.remove(e.obj));
  effects.length = 0;
  updateHud();
}

function startGame() {
  resetGame();
  state.mode = 'playing';
  startOv.style.display = 'none';
  endOv.style.display = 'none';
  say('잡아보시죠!', 1.4);
}

function endGame() {
  state.mode = 'over';
  document.getElementById('rScore').textContent = state.score;
  document.getElementById('rKO').textContent = state.kos;
  document.getElementById('rCombo').textContent = 'x' + state.maxCombo;
  endOv.style.display = 'flex';
}

function updateHud() {
  hudScore.textContent = state.score;
  hudKO.textContent = state.kos;
  hudTime.textContent = state.time.toFixed(1);
  hudCombo.textContent = 'x' + state.maxCombo;
  const ratio = Math.max(0, state.hp / state.maxHp);
  hpFill.style.width = (ratio * 100).toFixed(1) + '%';
  hpFill.style.background = ratio > 0.5 ? '#3B9E63' : (ratio > 0.25 ? '#F5A623' : '#D92646');
  hpName.textContent = '수환 Lv.' + state.level;
}

/* ---------- 입력 ---------- */
function updateAim(clientX, clientY) {
  const r = stage.getBoundingClientRect();
  const nx = ((clientX - r.left) / r.width) * 2 - 1;
  const ny = -((clientY - r.top) / r.height) * 2 + 1;
  pointer.x = nx; pointer.y = ny; pointer.has = true;
  raycaster.setFromCamera({ x: nx, y: ny }, camera);
  const p = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(aimPlane, p)) {
    if (p.z < 4.6) {
      aim.copy(p);
      reticle.position.set(aim.x, 0.01, aim.z);
    }
  }
}

stage.addEventListener('pointermove', e => updateAim(e.clientX, e.clientY));
stage.addEventListener('pointerdown', e => {
  if (state.mode !== 'playing') return;
  updateAim(e.clientX, e.clientY);
  throwBall();
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);

/* ---------- 크기 ---------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ---------- 화면 좌표 변환 ---------- */
const projV = new THREE.Vector3();
function toScreen(x, y, z) {
  projV.set(x, y, z).project(camera);
  return {
    x: (projV.x * 0.5 + 0.5) * stage.clientWidth,
    y: (-projV.y * 0.5 + 0.5) * stage.clientHeight,
    visible: projV.z < 1
  };
}

/* ---------- 업데이트 ---------- */
function updateGuy(dt) {
  if (state.koT > 0) {
    state.koT -= dt;
    const p = 1 - Math.max(0, state.koT) / 1.15;
    guy.rotation.x = -Math.min(1, p * 2.2) * 1.35;
    guy.position.y = Math.max(0, guy.position.y - dt * 2);
    if (state.koT <= 0) {
      state.level++;
      state.maxHp += 40;
      state.hp = state.maxHp;
      state.speed = Math.min(6.5, state.speed + 0.55);
      state.invT = 1.3;
      guy.rotation.x = 0;
      guy.position.y = 0;
      guyState.pos.set((Math.random() - 0.5) * 3.4, 0, -1 + Math.random() * 2.4);
      keepOnScreen();
      guyState.vel.set(0, 0, 0);
      say('부활! Lv.' + state.level, 1.5);
    }
  } else if (state.mode === 'playing') {
    state.invT = Math.max(0, state.invT - dt);
    state.flash = Math.max(0, state.flash - dt);

    const dx = guyState.pos.x - aim.x;
    const dz = guyState.pos.z - aim.z;
    const dAim = Math.hypot(dx, dz);
    let tx, tz, spd;
    if (dAim < 2.0 && state.invT <= 0) {
      const inv = dAim < 0.2 ? 1 : 1 / dAim;
      tx = dx * inv * (dAim < 0.2 ? 1 : 1);
      tz = dz * inv;
      if (dAim < 0.2) { tx = Math.random() - 0.5; tz = Math.random() - 0.5; }
      const n = Math.hypot(tx, tz) || 1;
      tx /= n; tz /= n;
      spd = state.speed * 1.2;
    } else {
      guyState.changeT -= dt;
      if (guyState.changeT <= 0) {
        guyState.changeT = 0.5 + Math.random() * 0.9;
        const a = Math.random() * Math.PI * 2;
        guyState.dir.set(Math.cos(a), Math.sin(a));
      }
      tx = guyState.dir.x; tz = guyState.dir.y;
      spd = state.speed * 0.8;
    }

    // 쉐도우 무빙: 조준점이 몸에 닿는 순간 순간이동급 대시로 빠져나감
    state.dashCD = Math.max(0, state.dashCD - dt);
    if (state.dashT <= 0 && state.roll <= 0 && state.invT <= 0 && state.dashCD <= 0 && dAim < 1.05) {
      startDash(dx, dz);
    }

    if (state.dashT > 0) {
      state.dashT -= dt;
      guyState.vel.copy(state.dashVel);
      state.ghostTick -= dt;
      if (state.ghostTick <= 0) { state.ghostTick = 0.042; spawnGhost(); }
    } else {
      const k = Math.min(1, dt * (dAim < 2.0 ? 3.2 : 6));
      guyState.vel.x += (tx * spd - guyState.vel.x) * k;
      guyState.vel.z += (tz * spd - guyState.vel.z) * k;
    }

    guyState.pos.x += guyState.vel.x * dt;
    guyState.pos.z += guyState.vel.z * dt;

    // 화면 안쪽으로만 돌아다니게 (앞쪽일수록 좌우 폭이 좁음)
    const zMin = -3.5, zMax = 2.1;
    if (guyState.pos.z < zMin) { guyState.pos.z = zMin; guyState.vel.z = Math.abs(guyState.vel.z); turnAround(); }
    if (guyState.pos.z > zMax) { guyState.pos.z = zMax; guyState.vel.z = -Math.abs(guyState.vel.z); turnAround(); }
    const xLim = Math.max(1.4, 2.9 - 0.34 * guyState.pos.z);
    if (guyState.pos.x < -xLim) { guyState.pos.x = -xLim; guyState.vel.x = Math.abs(guyState.vel.x); turnAround(); }
    if (guyState.pos.x > xLim) { guyState.pos.x = xLim; guyState.vel.x = -Math.abs(guyState.vel.x); turnAround(); }

    keepOnScreen();

    function turnAround() {
      guyState.changeT = 0;
      guyState.dir.set(Math.random() - 0.5, Math.random() - 0.5).normalize();
    }

    const moving = Math.hypot(guyState.vel.x, guyState.vel.z);

    if (state.roll > 0) {
      // 구르기 애니메이션 (한 바퀴 텀블링 + 살짝 뜸)
      state.roll -= dt;
      const p = 1 - Math.max(0, state.roll) / state.rollDur;
      guy.quaternion.setFromAxisAngle(state.rollAxis, p * Math.PI * 2);
      guy.position.y = Math.sin(p * Math.PI) * 0.22;
      legL.rotation.x = 0; legR.rotation.x = 0;
      armL.rotation.x = 0; armR.rotation.x = 0;
    } else {
      // 걷기 애니메이션
      state.walk += dt * (4 + moving * 2.4);
      legL.rotation.x = Math.sin(state.walk) * 0.55;
      legR.rotation.x = -Math.sin(state.walk) * 0.55;
      armL.rotation.x = -Math.sin(state.walk) * 0.5;
      armR.rotation.x = Math.sin(state.walk) * 0.5;
      guy.position.y = Math.abs(Math.sin(state.walk)) * 0.05;
      guy.rotation.z = -guyState.vel.x * 0.035;
      guy.rotation.x = guyState.vel.z * 0.03;
      guy.rotation.y = Math.atan2(guyState.vel.x, guyState.vel.z) * 0.25;
    }

    state.bubbleT -= dt;
    if (Math.random() < dt * 0.4 && state.bubbleT <= 0) {
      say(taunts[Math.floor(Math.random() * taunts.length)], 1.6);
    }

    state.comboT -= dt;
    if (state.comboT <= 0) state.combo = 0;

    state.time -= dt;
    if (state.time <= 0) { state.time = 0; endGame(); }

    guy.visible = state.invT > 0 ? (Math.floor(performance.now() / 90) % 2 === 0) : true;
  } else {
    guy.visible = true;
  }

  guy.position.x = guyState.pos.x;
  guy.position.z = guyState.pos.z;

  // 피격 플래시
  const f = state.flash > 0 ? Math.min(1, state.flash / 0.16) : 0;
  MAT.shirt.emissive.setRGB(f, f, f);
  MAT.shirt.emissiveIntensity = 1;
  MAT.skin.emissive.setRGB(f * 0.8, f * 0.8, f * 0.8);
  MAT.skin.emissiveIntensity = 1;
}

// 화면(NDC) 밖으로 나가지 않도록 안전하게 되돌림 — 창 비율이 달라져도 보장
const clampV = new THREE.Vector3();
function keepOnScreen() {
  for (let i = 0; i < 4; i++) {
    clampV.set(guyState.pos.x, 1.15, guyState.pos.z).project(camera);
    let moved = false;
    if (clampV.x > 0.8) { guyState.pos.x -= (clampV.x - 0.8) * 4.4; moved = true; }
    if (clampV.x < -0.8) { guyState.pos.x += (-0.8 - clampV.x) * 4.4; moved = true; }
    if (clampV.y > 0.46) { guyState.pos.z -= (clampV.y - 0.46) * 4.4; moved = true; }
    if (clampV.y < -0.62) { guyState.pos.z += (-0.62 - clampV.y) * 4.4; moved = true; }
    if (!moved) break;
  }
  guyState.pos.z = Math.max(-3.6, Math.min(2.3, guyState.pos.z));
  guyState.pos.x = Math.max(-3.6, Math.min(3.6, guyState.pos.x));
}

function updateBalls(dt) {
  const torso = new THREE.Vector3(guyState.pos.x, 1.0, guyState.pos.z);
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.prev = b.prev || new THREE.Vector3();
    b.prev.copy(b.mesh.position);
    b.vel.y -= G * dt;
    b.mesh.position.addScaledVector(b.vel, dt);
    b.life += dt;

    // 캐릭터 충돌 (이전 위치 → 현재 위치 스윕)
    if (!b.dead && state.mode === 'playing' && state.koT <= 0) {
      const p = b.mesh.position;
      let d;
      if (b.prev) {
        const ax = b.prev.x - torso.x, ay = b.prev.y - torso.y, az = b.prev.z - torso.z;
        const bx = p.x - torso.x, by = p.y - torso.y, bz = p.z - torso.z;
        const ex = bx - ax, ey = by - ay, ez = bz - az;
        const len2 = ex*ex + ey*ey + ez*ez;
        let t = len2 > 0 ? -(ax*ex + ay*ey + az*ez) / len2 : 0;
        t = Math.max(0, Math.min(1, t));
        d = Math.hypot(ax + ex*t, ay + ey*t, az + ez*t);
      } else {
        d = Math.hypot(p.x - torso.x, p.y - torso.y, p.z - torso.z);
      }
      if (d < 0.72) {
        b.dead = true;
        hitSuhwan(p.clone(), b.vel.clone());
        scene.remove(b.mesh);
        balls.splice(i, 1);
        continue;
      }
    }

    // 바닥
    if (b.mesh.position.y < 0.15) {
      b.mesh.position.y = 0.15;
      b.vel.y = -b.vel.y * 0.42;
      b.vel.x *= 0.87;
      b.vel.z *= 0.87;
      b.bounced++;
      if (b.bounced > 3) b.vel.multiplyScalar(0.6);
    }

    if (b.life > 4 || b.mesh.position.length() > 22 || b.vel.length() < 0.7) {
      scene.remove(b.mesh);
      balls.splice(i, 1);
    }
  }
}

function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.life += dt;
    if (e.life >= e.max) { scene.remove(e.obj); effects.splice(i, 1); continue; }
    e.obj.position.addScaledVector(e.vel, dt);
    if (e.type === 'star') e.vel.y -= 12 * dt;
    const a = 1 - e.life / e.max;
    if (e.type === 'ghost') {
      for (let mi = 0; mi < e.mats.length; mi++) e.mats[mi].opacity = 0.34 * a;
      continue;
    }
    e.obj.material.opacity = a;
    if (e.type === 'star') e.obj.material.rotation += dt * 5;
    e.obj.scale.multiplyScalar(1 + dt * 0.4);
  }
}

function updateHpBar() {
  if (state.mode === 'playing' && state.koT <= 0) {
    const p = toScreen(guyState.pos.x, 2.55, guyState.pos.z);
    hpWrap.style.display = p.visible ? 'block' : 'none';
    hpWrap.style.left = p.x + 'px';
    hpWrap.style.top = p.y + 'px';
  } else {
    hpWrap.style.display = 'none';
  }

  if (state.bubbleT > 0 && state.mode === 'playing') {
    const p = toScreen(guyState.pos.x, 2.95, guyState.pos.z);
    bubbleEl.style.opacity = p.visible ? '1' : '0';
    bubbleEl.style.left = p.x + 'px';
    bubbleEl.style.top = p.y + 'px';
  } else {
    bubbleEl.style.opacity = '0';
  }
}

/* ---------- 루프 ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  updateGuy(dt);
  updateBalls(dt);
  updateEffects(dt);

  // 리티클 표시
  const showReticle = state.mode === 'playing' && pointer.has;
  reticle.visible = showReticle;
  const t = now / 1000;
  const pulse = 1 + Math.sin(t * 6) * 0.06;
  reticle.scale.set(pulse, pulse, pulse);

  updateHpBar();
  updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);

// 테스트/디버그용 훅
window.__game = { state, guyState, aim, balls, guy, camera, THREE };
</script>
